name: CI

# Har bir push va pull request'da butun tekshiruv ishlaydi. Maqsad oddiy:
# buzilgan kod main'ga tushmasligi kerak. Testlar PostgreSQL'da bajariladi —
# loyiha productionda ham shu bazada ishlaydi, SQLite esa bir xil kodni
# boshqacha bajaradi (butun sonlarni bo'lganda kasrni tashlaydi, CHECK
# cheklovlarini yumshoqroq tekshiradi), ya'ni SQLite'dagi yashil natija
# serverda ishlashini kafolatlamaydi.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend — testlar va linter
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: xonim
          POSTGRES_USER: xonim
          POSTGRES_PASSWORD: xonim-ci-password
        ports: ['5432:5432']
        # Baza tayyor bo'lmasdan testlar boshlanib ketmasligi uchun.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Kamida 50 belgi: `check --deploy` qisqa kalitni xavfsizlik
      # ogohlantirishi sifatida belgilaydi, biz esa endi ogohlantirishda
      # ham to'xtaymiz.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-value-long-enough-for-the-deploy-check
      POSTGRES_DB: xonim
      POSTGRES_USER: xonim
      POSTGRES_PASSWORD: xonim-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Bog‘liqliklarni o‘rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r xonim_backend/requirements.lock
          pip install ruff

      - name: Linter
        run: ruff check xonim_backend

      # Bu qadam ilgari hech narsani ushlamasdi: DJANGO_DEBUG berilmagani
      # uchun tekshiruv DEBUG yoqiq holatda yurar, `--deploy` topgan hamma
      # narsa esa WARNING darajasida bo'lgani uchun `--fail-level ERROR`
      # ularni o'tkazib yuborardi — shu jumladan «DEBUG=True».
      - name: Django xavfsizlik tekshiruvi
        working-directory: xonim_backend
        env:
          DJANGO_DEBUG: '0'
        run: python manage.py check --deploy --fail-level WARNING

      - name: Qo‘llanmagan migratsiya qolmaganini tekshirish
        working-directory: xonim_backend
        run: python manage.py makemigrations --check --dry-run

      - name: Testlar
        working-directory: xonim_backend
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend — tip, linter va yig‘ish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xonim_frontend/package-lock.json

      - name: Bog‘liqliklarni o‘rnatish
        working-directory: xonim_frontend
        run: npm ci

      - name: Tiplar
        working-directory: xonim_frontend
        run: npm run typecheck

      - name: Linter
        working-directory: xonim_frontend
        run: npm run lint

      - name: Yig‘ish
        working-directory: xonim_frontend
        run: npm run build
