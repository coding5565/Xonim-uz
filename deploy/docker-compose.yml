# Xonim CRM — bitta loyiha sifatida umumiy serverda.
#
# Tuzilishi ~/apps/README.md dagi qoidaga amal qiladi: Traefik faqat
# `web` tarmog'idagi konteynerni ko'radi, baza esa tashqariga umuman
# chiqmaydi (`internal` tarmoq).
#
#   Traefik ──HTTPS──> web (nginx)  ──/api──> app (gunicorn) ──> db (Postgres)
#                        └── SPA, /media, /static
services:
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT}_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Zaxira nusxa va solishtirishlar bir xil bo'lishi uchun.
      TZ: Asia/Tashkent
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Ilova baza tayyor bo'lguncha kutadi: aks holda birinchi migratsiya
      # «connection refused» bilan yiqilardi.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: ${PROJECT}_app
    container_name: ${PROJECT}_app
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_STATIC_ROOT: /var/lib/xonim/static
      DJANGO_MEDIA_ROOT: /var/lib/xonim/media
      BACKUP_DIR: /var/lib/xonim/backups
      AGENT_DIR: /var/lib/xonim/agent
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/var/lib/xonim/static
      - media_files:/var/lib/xonim/media
      # Zaxira nusxalar konteyner qayta qurilganda yo'qolmasin.
      - backup_files:/var/lib/xonim/backups
      # Agentning .exe fayli: konteyner qayta qurilganda yo'qolmasin.
      - agent_files:/var/lib/xonim/agent
    networks:
      # Baza va nginx bilan gaplashish uchun.
      - internal
      # Faqat CHIQISH uchun. `internal` tarmoq tashqariga umuman yo'l
      # bermaydi — hatto DNS ham ishlamaydi — shuning uchun AI yordamchi
      # OpenAI ga chiqa olmasdi. Bu tarmoqda hech qanday port ochilmaydi:
      # u ichkariga emas, tashqariga yo'l ochadi.
      - egress

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: ${PROJECT}_web
    container_name: ${PROJECT}_web
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      # Faqat o'qish uchun: nginx bu fayllarni bermaydi, yozmaydi.
      - static_files:/var/lib/xonim/static:ro
      - media_files:/var/lib/xonim/media:ro
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${PROJECT}.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${PROJECT}.entrypoints=websecure
      - traefik.http.routers.${PROJECT}.tls=true
      - traefik.http.routers.${PROJECT}.tls.certresolver=le
      - traefik.http.services.${PROJECT}.loadbalancer.server.port=80
      # www.<domen> -> <domen>. Alohida router: www resolve bo'lmasa
      # (masalan sslip.io), faqat shu router sertifikatsiz qoladi,
      # asosiy domenning sertifikatiga ta'sir qilmaydi.
      - traefik.http.routers.${PROJECT}-www.rule=Host(`www.${DOMAIN}`)
      - traefik.http.routers.${PROJECT}-www.entrypoints=websecure
      - traefik.http.routers.${PROJECT}-www.tls=true
      - traefik.http.routers.${PROJECT}-www.tls.certresolver=le
      - traefik.http.routers.${PROJECT}-www.middlewares=${PROJECT}-www
      - traefik.http.middlewares.${PROJECT}-www.redirectregex.regex=^https?://www\.(.*)
      - traefik.http.middlewares.${PROJECT}-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.${PROJECT}-www.redirectregex.permanent=true
      # Eski manzil (LEGACY_DOMAIN). Sahifalar yangi domenga yo'naltiriladi,
      # /api/ esa shu yerda xizmat qilishda davom etadi: o'rnatilgan agentlar
      # POST yuboradi, yo'naltirishda esa so'rov tanasi yo'qoladi. Agent
      # yangi manzilni o'zi oladi (server_url), shundan keyin LEGACY_DOMAIN
      # ni bo'shatish mumkin. Bo'sh bo'lsa hech qachon mos kelmaydigan
      # `.invalid` nom qo'yiladi — DOMAIN bilan to'qnashib, cheksiz
      # yo'naltirish halqasi yasamasin.
      - traefik.http.routers.${PROJECT}-legacy.rule=Host(`${LEGACY_DOMAIN:-legacy.invalid}`) && !PathPrefix(`/api/`)
      - traefik.http.routers.${PROJECT}-legacy.entrypoints=websecure
      - traefik.http.routers.${PROJECT}-legacy.tls=true
      - traefik.http.routers.${PROJECT}-legacy.tls.certresolver=le
      - traefik.http.routers.${PROJECT}-legacy.middlewares=${PROJECT}-legacy
      - traefik.http.middlewares.${PROJECT}-legacy.redirectregex.regex=^https?://[^/]+/(.*)
      - traefik.http.middlewares.${PROJECT}-legacy.redirectregex.replacement=https://${DOMAIN}/$${1}
      - traefik.http.middlewares.${PROJECT}-legacy.redirectregex.permanent=false
      - traefik.http.routers.${PROJECT}-legacy-api.rule=Host(`${LEGACY_DOMAIN:-legacy.invalid}`) && PathPrefix(`/api/`)
      - traefik.http.routers.${PROJECT}-legacy-api.entrypoints=websecure
      - traefik.http.routers.${PROJECT}-legacy-api.tls=true
      - traefik.http.routers.${PROJECT}-legacy-api.tls.certresolver=le

volumes:
  db_data:
  static_files:
  media_files:
  backup_files:
  agent_files:

networks:
  web:
    external: true
  # Baza shu yerda yashaydi va tashqariga umuman chiqa olmaydi.
  internal:
    internal: true
  # Ilovaning tashqariga chiqishi (OpenAI). Ichkariga hech narsa
  # ochilmaydi: bu tarmoqda port e'lon qilinmagan.
  egress:
