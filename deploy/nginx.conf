# Bitta manzil ostida: SPA + API + media. Traefik shu konteynerga keladi.
upstream xonim_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Taom rasmi 5 MB gacha bo'lishi mumkin (catalog/serializers.py).
    # Chegara kichik bo'lsa nginx so'rovni Django'gacha yetkazmay rad etardi.
    client_max_body_size 8m;

    # Versiya raqamini oshkor qilmaymiz.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ---
    location /api/ {
        proxy_pass http://xonim_app;
        proxy_http_version 1.1;
        # Host o'zgarmasdan o'tadi: Django ALLOWED_HOSTS ni shunga qarab
        # tekshiradi va rasm manzillarini shu nom bilan yasaydi.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Traefik'dan kelgan sxema uzatiladi. Busiz Django so'rovni HTTP
        # deb hisoblab, cheksiz HTTPS-redirect hosil qilardi.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # --- Yuklangan rasmlar ---
    # Django ularni serverda BERMAYDI (bu faqat DEBUG rejimida ishlaydi),
    # shuning uchun ularni nginx diskdan o'zi beradi.
    location /media/ {
        alias /var/lib/xonim/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /static/ {
        alias /var/lib/xonim/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- SPA ---
    # Vite nomiga xesh qo'shadi, shuning uchun aktivlar uzoq keshlanadi.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Marshrutlar brauzer tomonida: /pos/stol/4 ga to'g'ridan-to'g'ri
    # kirilganda ham index.html qaytishi kerak, aks holda 404 chiqardi.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # index.html keshlanmaydi: aks holda yangi versiya chiqqanda
        # brauzer eski fayl nomlarini so'rab turaverardi.
        add_header Cache-Control "no-cache";
    }
}
